services:
  backend:
    build: ./backend
    env_file: [.env]
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8000/api/health')"], interval: 15s, retries: 3}
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"}}
    ports: ["5173:80"]
    depends_on: {backend: {condition: service_healthy}}
